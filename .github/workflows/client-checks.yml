name: Web checks

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/client-checks.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/client-checks.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Web dependencies
        run: npm install --no-audit --no-fund
      - name: Lint Web
        run: npm run lint
      - name: Build Web
        run: npm run build
